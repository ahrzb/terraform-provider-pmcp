name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      # `nix flake check` covers the build, `gofmt`, `go vet` and the Go tests; the tests are
      # offline (the admin client is exercised against an httptest fake), so no hub and no
      # credentials are needed here. Matches the sibling terraform-provider-gws repo.
      - run: nix flake check -L
      - run: nix build .#default -L
